# Myboxi image for the Raspberry Pi 4 (docs/box-inbetriebnahme.md).
# Native build on an arm64 runner; artifact for branch builds, GitHub release for box-v* tags.
name: image

on:
  workflow_dispatch:
  push:
    # Branch pushes build when the image itself changes; tag pushes (paths are not evaluated
    # for tags) publish a release.
    branches: ["**"]
    tags: ["box-v*"]
    paths: ["image/**", ".github/workflows/image.yml"]

permissions:
  contents: write

env:
  UV_VERSION: "0.12.18"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg parted e2fsprogs xz-utils
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: prompts (Piper at build time only)
        run: uv run --no-project --with piper-tts python tools/prompts/build_prompts.py --out build/prompts
      - name: image
        run: |
          VERSION="${GITHUB_REF_NAME#box-v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          sudo env UV_BIN="$(command -v uv)" MYBOXI_IMAGE_VERSION="$VERSION" \
            PROMPTS_DIR=build/prompts image/build.sh
          sudo chown -R "$(id -u):$(id -g)" build
      - name: artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: myboxi-image
          path: |
            build/myboxi-*.img.xz
            build/myboxi-*.img.xz.sha256
          retention-days: 14
          compression-level: 0
      - name: release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/myboxi-*.img.xz build/myboxi-*.img.xz.sha256 \
            --title "Myboxi ${GITHUB_REF_NAME#box-v}" \
            --notes "Image für Raspberry Pi 4. Anleitung: docs/box-inbetriebnahme.md"
