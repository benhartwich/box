# Licensing per path (REUSE, https://reuse.software). The last matching annotation wins.
# Check: uvx reuse lint
version = 1
SPDX-PackageName = "Myboxi"
SPDX-PackageDownloadLocation = "https://github.com/benhartwich/myboxi"

# Default: server, tools, deployment and repository files.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Benjamin Hartwich"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Documentation and specification.
[[annotations]]
path = ["docs/**", "README.md", "CLAUDE.md"]
SPDX-FileCopyrightText = "2026 Benjamin Hartwich"
SPDX-License-Identifier = "CC-BY-4.0"

# Protocol models: permissive, so third-party agents, servers and integrations can use them.
[[annotations]]
path = "packages/protocol/**"
SPDX-FileCopyrightText = "2026 Benjamin Hartwich"
SPDX-License-Identifier = "Apache-2.0"

# Box agent and the Raspberry Pi image.
[[annotations]]
path = ["agent/**", "image/**"]
SPDX-FileCopyrightText = "2026 Benjamin Hartwich"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Case generator (code). The generated print files are CC BY-SA 4.0 (see their LIESMICH.txt).
[[annotations]]
path = "hardware/**"
SPDX-FileCopyrightText = "2026 Benjamin Hartwich"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Vendored third-party files.
[[annotations]]
path = "server/src/myboxi_server/api/web/static/htmx.min.js"
SPDX-FileCopyrightText = "Big Sky Software (htmx.org)"
SPDX-License-Identifier = "0BSD"

[[annotations]]
path = "server/src/myboxi_server/api/web/static/vendor/three-0.186.1/**"
SPDX-FileCopyrightText = "2010-2026 Three.js Authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "server/migrations/sql/procrastinate_3.10.0_schema.sql"
SPDX-FileCopyrightText = [
  "2019-2021 PeopleDoc",
  "2021-2023 Joachim Jablon, Eric Lemoine",
  "2024 Joachim Jablon, Kai Schlamp",
]
SPDX-License-Identifier = "MIT"

# Fonts, self-hosted (web UI and landing page).
[[annotations]]
path = ["**/figtree-latin-wght-normal.woff2", "**/figtree-latin*-800-normal.woff"]
SPDX-FileCopyrightText = "2022 The Figtree Project Authors (https://github.com/erikdkennedy/figtree)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["**/fraunces-latin-wght-normal.woff2"]
SPDX-FileCopyrightText = "2020 The Fraunces Project Authors (https://github.com/undercasetype/Fraunces)"
SPDX-License-Identifier = "OFL-1.1"
