[project]
name = "myboxi-agent"
version = "0.3.0"
description = "Myboxi box agent: figures, buttons, playback, sync (SPEC v0.5)"
license = "GPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
dependencies = [
  "myboxi-protocol",
  "httpx>=0.28",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
]

[project.optional-dependencies]
# Hardware adapters, installed on the Raspberry Pi image only (lgpio comes from Debian).
hw = [
  "gpiozero>=2.0",
  "adafruit-circuitpython-pn532>=2.4",
  "adafruit-blinka>=8.50",
]

[project.scripts]
myboxi-agent = "myboxi_agent.cli:main"

[tool.uv.sources]
myboxi-protocol = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
