# Mosquitto for Myboxi (SPEC §6): /etc/mosquitto/conf.d/myboxi.conf
# TLS only on 8883, no anonymous clients, one account per box (dynamic security plugin).
# The certificate is app.myboxi.eu's, copied by the certbot deploy hook
# (deploy/mosquitto/certbot-deploy-hook). Setup: docs/betrieb-debian13.md, "MQTT".
per_listener_settings false
allow_anonymous false

listener 8883
protocol mqtt
certfile /etc/mosquitto/certs/myboxi/fullchain.pem
keyfile /etc/mosquitto/certs/myboxi/privkey.pem
tls_version tlsv1.2

plugin /usr/lib/x86_64-linux-gnu/mosquitto_dynamic_security.so
plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json

# Limits: messages are small JSON documents (SPEC §6); nothing may pile up.
max_packet_size 65536
max_inflight_messages 20
max_queued_messages 100
max_keepalive 300
# Retained "reported" and "online" survive a broker restart.
persistence true
