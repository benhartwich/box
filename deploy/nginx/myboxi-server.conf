# Myboxi server site for nginx (Debian 13). Replace myboxi.example.org with your domain.
# Installed to /etc/nginx/sites-available/myboxi-server.conf, see docs/betrieb-debian13.md.
# sites-enabled/* is included inside the http {} block, so zones and formats can live here.

# Never log query strings: /api/v1/pairing/poll carries the poll token (SPEC §7.1),
# /invite carries the invitation token.
log_format myboxi_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=myboxi_pairing:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=myboxi_login:10m rate=20r/m;

upstream myboxi_server {
    server unix:/run/myboxi-server/api.sock;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name myboxi.example.org;
    access_log /var/log/nginx/myboxi/app.access.log myboxi_noquery;  # 14 days: deploy/logrotate
    error_log /var/log/nginx/myboxi/app.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name myboxi.example.org;

    ssl_certificate     /etc/letsencrypt/live/myboxi.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myboxi.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:myboxi_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/myboxi/app.access.log myboxi_noquery;  # 14 days: deploy/logrotate
    error_log /var/log/nginx/myboxi/app.error.log;

    # Keep in line with MYBOXI_SERVER_MAX_UPLOAD_MB (per file) plus form overhead.
    client_max_body_size 1100m;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    # Scripts and styles compressed (three.js for "Box gestalten" is about 2 MB unminified).
    # The case preview is already gzip-encoded by the app.
    gzip on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript;

    location / {
        proxy_pass http://myboxi_server;
    }

    location /api/v1/pairing/ {
        limit_req zone=myboxi_pairing burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://myboxi_server;
    }

    location = /login {
        limit_req zone=myboxi_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://myboxi_server;
    }

    # Asset delivery after the app's permission check (X-Accel-Redirect, SPEC §3.8).
    # "internal": never reachable directly from outside.
    location ~ "^/_assets/(?<p1>[0-9a-f]{2})/(?<p2>[0-9a-f]{2})/(?<sha>[0-9a-f]{64})\.opus$" {
        internal;
        alias /var/lib/myboxi-server/assets/$p1/$p2/$sha.opus;
        types { }
        default_type "audio/ogg; codecs=opus";
        etag off;
        add_header ETag "\"$sha\"" always;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
    }
    location ~ "^/_assets/(?<p1>[0-9a-f]{2})/(?<p2>[0-9a-f]{2})/(?<sha>[0-9a-f]{64})\.jpg$" {
        internal;
        alias /var/lib/myboxi-server/assets/$p1/$p2/$sha.jpg;
        types { }
        default_type image/jpeg;
        etag off;
        add_header ETag "\"$sha\"" always;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
    }
}
