# myboxi.eu landing page: static files from the repository checkout (site/).
# Certificates: certbot certonly --webroot -w /var/www/html -d myboxi.eu -d www.myboxi.eu
# Logs in /var/log/nginx/myboxi/, kept 14 days (deploy/logrotate/myboxi-nginx, site/datenschutz.html).
server {
    listen 80;
    listen [::]:80;
    server_name myboxi.eu www.myboxi.eu;
    access_log /var/log/nginx/myboxi/site.access.log;
    error_log /var/log/nginx/myboxi/site.error.log;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://myboxi.eu$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.myboxi.eu;
    access_log /var/log/nginx/myboxi/site.access.log;
    error_log /var/log/nginx/myboxi/site.error.log;
    ssl_certificate     /etc/letsencrypt/live/myboxi.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myboxi.eu/privkey.pem;
    return 301 https://myboxi.eu$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name myboxi.eu;
    ssl_certificate     /etc/letsencrypt/live/myboxi.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myboxi.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/myboxi/site.access.log;
    error_log /var/log/nginx/myboxi/site.error.log;
    root /opt/myboxi-server/site;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /impressum { try_files /impressum.html =404; }
    location = /datenschutz { try_files /datenschutz.html =404; }
    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable" always;
                       add_header Access-Control-Allow-Origin "*" always; }
    location / { try_files $uri $uri/ =404; }
}
