[project]
name = "myboxi-protocol"
version = "0.6.0"
description = "Myboxi device protocol v1 message models (SPEC v0.4), shared by agent and server"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.11"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
