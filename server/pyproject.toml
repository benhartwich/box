[project]
name = "myboxi-server"
version = "0.3.0"
description = "Myboxi server: tenants, library, device API (SPEC v0.4)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
dependencies = [
  "myboxi-protocol",
  "fastapi>=0.118",
  "uvicorn[standard]>=0.37",
  "sqlalchemy[asyncio]>=2.0.43",
  "asyncpg>=0.30",
  "alembic>=1.16",
  "procrastinate==3.10.0",  # schema vendored in migrations/sql
  "argon2-cffi>=25.1",
  "jinja2>=3.1.6",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "pyjwt>=2.10",
  # AES-GCM for stored Spotify refresh tokens (auth/secretbox.py).
  "cryptography>=44",
  # Spotify Web API for searching in the web UI (domain/spotify.py).
  "httpx>=0.28",
  "myboxi-case",
]

[tool.uv.sources]
myboxi-protocol = { workspace = true }
myboxi-case = { workspace = true }

[project.scripts]
myboxi-server = "myboxi_server.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
