<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Box{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body {% if csrf_token %}hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  <header class="topbar">
    <a class="brand" href="{% if tid %}/t/{{ tid }}/{% else %}/{% endif %}">Box</a>
    {% if user %}
    <nav class="mainnav">
      {% if tid %}
      <a href="/t/{{ tid }}/boxes">Boxen</a>
      <a href="/t/{{ tid }}/figures">Figuren</a>
      <a href="/t/{{ tid }}/contents">Inhalte</a>
      <a href="/t/{{ tid }}/members">Mitglieder</a>
      {% endif %}
    </nav>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="link">Abmelden</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% if error %}<p class="msg error" role="alert">{{ error }}</p>{% endif %}
    {% if notice %}<p class="msg ok" role="status">{{ notice }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
