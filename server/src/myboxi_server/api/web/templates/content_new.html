{% extends "base.html" %}
{% block title %}Neuer Inhalt · Myboxi{% endblock %}
{% block content %}
<p><a href="/t/{{ tid }}/contents">← Inhalte</a></p>
<h1>{{ kind_labels[kind] }} anlegen</h1>
<form method="post" action="/t/{{ tid }}/contents" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="kind" value="{{ kind.value }}">
  <label>Titel <input name="title" value="{{ form.title or '' }}" maxlength="200" required></label>
  {% include "_source_fields.html" %}
  <button type="submit">Anlegen</button>
</form>
{% endblock %}
